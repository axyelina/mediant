name: Mediant
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.3
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    # Paid individual team (Angelina Odegova). Development profiles last a year.
    DEVELOPMENT_TEAM: NDCC8HH7D8
    CURRENT_PROJECT_VERSION: "3"
targets:
  Mediant:
    type: application
    platform: iOS
    sources:
      - Mediant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mediant
        INFOPLIST_KEY_CFBundleDisplayName: "Median't"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Median't shows your photos so you can swipe to keep or delete them. Nothing leaves your phone."
        GENERATE_INFOPLIST_FILE: YES
        # The app icon stretched to the screen; the splash animation starts from the same frame.
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Only standard HTTPS (Crashlytics, App Store): exempt, so TestFlight and the App Store
        # do not stop every build at "Missing Compliance".
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"Mediant/Preview Content\""
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        # Crashlytics needs a dSYM in Debug too: development builds on the phone crash as well.
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    dependencies:
      # Crash reports only. Never add FirebaseAnalytics: the design forbids tracking.
      - package: Firebase
        product: FirebaseCrashlytics
    postBuildScripts:
      - name: Upload dSYM to Crashlytics
        basedOnDependencyAnalysis: false
        script: |
          # Simulator builds and test runs have no crashes worth a report.
          [ "$PLATFORM_NAME" = "iphonesimulator" ] && exit 0
          # Unsigned builds (the local binary check) never reach a phone.
          [ "$CODE_SIGNING_ALLOWED" = "NO" ] && exit 0
          # Packages are in DerivedData, or in Xcode's shared folder when one is set.
          for packages in "${BUILD_DIR%/Build/*}/SourcePackages" \
              "$(defaults read com.apple.dt.Xcode IDEClonedSourcePackagesDirPathOverride 2>/dev/null)"; do
            run="$packages/checkouts/firebase-ios-sdk/Crashlytics/run"
            [ -x "$run" ] && exec "$run"
          done
          echo "warning: Crashlytics run script not found, dSYM not uploaded"
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
  MediantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MediantTests
    dependencies:
      - target: Mediant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mediant.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Mediant:
    build:
      targets:
        Mediant: all
        MediantTests: [test]
    run:
      # The four tips for Debug runs on the simulator; no App Store needed.
      storeKitConfiguration: MediantTests/Tips.storekit
    test:
      targets:
        - MediantTests
