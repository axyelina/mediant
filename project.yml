name: Mediant
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    # Free personal team (Lina Barkhatova). Apps signed with it expire after 7 days on a device.
    DEVELOPMENT_TEAM: NDCC8HH7D8
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mediant:
    type: application
    platform: iOS
    sources:
      - Mediant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mediant
        INFOPLIST_KEY_CFBundleDisplayName: "Median't"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Median't shows your photos so you can swipe to keep or delete them. Nothing leaves your phone."
        GENERATE_INFOPLIST_FILE: YES
        # The app icon stretched to the screen; the splash animation starts from the same frame.
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"Mediant/Preview Content\""
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
  MediantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MediantTests
    dependencies:
      - target: Mediant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mediant.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Mediant:
    build:
      targets:
        Mediant: all
        MediantTests: [test]
    test:
      targets:
        - MediantTests
