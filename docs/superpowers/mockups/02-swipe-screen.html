<h2>Page slide — ✨-style sparkles (v3)</h2>
<p class="subtitle">No DELETE / KEEP words. Pointy, tall four-point stars like ✨. Some come in little clusters. Drag to see them.</p>

<style>
  .anims { display:flex; flex-wrap:wrap; gap:34px 28px; justify-content:center; margin-top:14px; }
  .opt { width:250px; display:flex; flex-direction:column; align-items:center; gap:10px; }
    .opt h3 { margin:4px 0 0; align-self:flex-start; } .opt p { margin:0; font-size:13px; opacity:.8; }
  .ph { width:240px; height:500px; border-radius:38px; border:8px solid #2a2a2e; overflow:hidden; position:relative;
        font-family:-apple-system,system-ui,sans-serif; color:#fff; background:#000; box-shadow:0 10px 34px rgba(0,0,0,.45);
        user-select:none; -webkit-user-select:none; touch-action:none; }
  .isl { position:absolute; top:8px; left:50%; transform:translateX(-50%); width:76px; height:21px; background:#000; border-radius:12px; z-index:20; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; padding:4px 8px; border-radius:20px;
          background:rgba(255,255,255,.14); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .top { position:absolute; top:40px; left:12px; right:12px; display:flex; justify-content:space-between; z-index:10; pointer-events:none; }
  .photo { position:absolute; inset:0; background-size:cover; background-position:center; background-repeat:no-repeat; background-color:#000; will-change:transform; isolation:isolate; }
  .blur { position:absolute; inset:-30px; background-size:cover; background-position:center; filter:blur(26px) brightness(.45); }
  .pic { position:absolute; inset:0; background-position:center; background-repeat:no-repeat; }
  .photo.next { filter:brightness(.6); transform:scale(.94); }
  .photo.cur { cursor:grab; z-index:2; } .photo.cur:active { cursor:grabbing; }
  .tint { position:absolute; inset:0; pointer-events:none; opacity:0; }
  .edge { position:absolute; top:0; bottom:0; width:120px; z-index:5; pointer-events:none; opacity:0; }
  .edge.l { left:0; --c:#ff453a; --g:rgba(255,69,58,.9); } .edge.r { right:0; --c:#30d158; --g:rgba(48,209,88,.9); }
  .spk { position:absolute; color:var(--c); line-height:0; filter:drop-shadow(0 0 2px var(--g)) drop-shadow(0 0 7px var(--g));
         animation:twinkle var(--d) ease-in-out var(--dl) infinite; }
  @keyframes twinkle { 0%,100% { transform:scale(.4) rotate(-8deg); opacity:.3; } 50% { transform:scale(1.1) rotate(6deg); opacity:1; } }
  .shade { position:absolute; left:0; right:0; bottom:0; height:150px; background:linear-gradient(0deg,rgba(0,0,0,.92) 40%,transparent); z-index:7; pointer-events:none; }
  .size { position:absolute; left:14px; bottom:94px; z-index:8; font-size:11px; font-weight:600; color:rgba(255,255,255,.7); }
  .undo { position:absolute; right:12px; bottom:90px; z-index:8; cursor:pointer; }
  .strip { position:absolute; bottom:36px; left:0; right:0; height:44px; z-index:8; overflow:hidden; }
  .rail { position:absolute; left:0; top:0; height:100%; display:flex; gap:4px; align-items:center; transition:transform .35s cubic-bezier(.2,.8,.2,1); }
  .t { flex:none; width:calc(36px * var(--r)); height:36px; border-radius:5px; background-size:cover; background-position:center; position:relative; opacity:.8;
       transition:all .3s ease; }
  .t.cur { width:calc(42px * var(--r)); height:42px; opacity:1; box-shadow:0 0 0 2px #fff; }
  .t.gone { background-blend-mode:luminosity; background-color:#555; }
  .t.gone::before { content:""; position:absolute; inset:0; border-radius:5px; background:rgba(0,0,0,.55); }
  .t.gone::after { content:"👹"; position:absolute; right:-3px; bottom:-3px; font-size:11px; line-height:1; z-index:1; filter:drop-shadow(0 0 2px rgba(0,0,0,.8)); }
  .t.kept::after { content:"💖"; position:absolute; right:-3px; bottom:-3px; font-size:11px; filter:drop-shadow(0 0 2px rgba(0,0,0,.8)); }
  .t.pop { animation:pop .45s ease; }
  @keyframes pop { 40% { transform:scale(1.35); } }
  .t.gone.just::after { animation:ogre .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes ogre {
    0%   { opacity:0; transform:translate(calc(-18px * var(--r) + 2.5px), -13px) scale(3); }
    25%  { opacity:1; transform:translate(calc(-18px * var(--r) + 2.5px), -13px) scale(3); }
    100% { opacity:1; transform:none; }
  }
  .ctl { display:flex; gap:8px; }
  .ctl button { font:600 12px -apple-system,system-ui,sans-serif; padding:7px 12px; border-radius:16px; border:1px solid rgba(255,255,255,.2);
                background:rgba(255,255,255,.08); color:inherit; cursor:pointer; }
  .ctl .pick { border-color:#0a84ff; color:#0a84ff; }
</style>

<div class="anims">
  <div class="opt" data-style="slide">
    <div class="ph"></div>
    <div class="ctl"><button data-act="del">◀ Delete</button><button data-act="keep">Keep ▶</button></div>
    <h3>B · Page slide</h3><p>No tilt. The photo slides flat, like pages in Photos. The next photo moves in with it. Calm and fast.</p>
  </div>
</div>

<script>
(function () {
  const SEEDS = ['med4','s5','s6','s7','s8','med1','med2','med3','med5','med6','med7','s1','s2','s3','a1','a2','a3','a4'];
  const SIZES = ['4.2 MB','2.8 MB','6.1 MB','1.3 MB','3.7 MB','5.5 MB','2.1 MB','8.9 MB','3.3 MB','4.8 MB','1.9 MB','2.6 MB','7.2 MB','3.0 MB','4.4 MB','2.2 MB','5.0 MB','3.9 MB'];
  const url = (s, w, h) => `https://picsum.photos/seed/${s}/${w}/${h}`;
  // portrait, landscape, square, panorama-ish and screenshot-tall shapes
  const R = [0.75,1.333,1,0.5625,1.778,0.75,1,1.333,0.75,1.5,0.5625,1,1.333,0.75,1.778,1,0.75,1.333];
  const EASE = 'cubic-bezier(.2,.8,.2,1)';

  function phone(opt) {
    const style = opt.dataset.style;
    const ph = opt.querySelector('.ph');
    ph.innerHTML = `
      <div class="isl"></div>
      <div class="photo next"><div class="blur"></div><div class="pic"></div></div><div class="photo cur"><div class="blur"></div><div class="pic"></div><div class="tint"></div></div>
      <div class="edge l"></div><div class="edge r"></div>
      <div class="top"><span class="chip">‹ Back</span><span class="chip cnt"></span></div>
      <div class="shade"></div><div class="size"></div><span class="chip undo">↶ Undo</span>
      <div class="strip"><div class="rail"></div></div>`;
    const $ = s => ph.querySelector(s);
    const cur = $('.photo.cur'), next = $('.photo.next'), tint = $('.tint');
    const eL = $('.edge.l'), eR = $('.edge.r');
    // ✨-like star: four long, concave points, taller than wide
    const star = (cx, cy, h) => { const w = h * .58, k = h * .035;
      const arm = (x, y, cx1, cy1) => `Q${cx1} ${cy1} ${x} ${y}`;
      return `M${cx} ${cy - h / 2}` + arm(cx + w / 2, cy, cx + k, cy - k) + arm(cx, cy + h / 2, cx + k, cy + k) +
             arm(cx - w / 2, cy, cx - k, cy + k) + arm(cx, cy - h / 2, cx - k, cy - k) + 'Z'; };
    const sparkle = cluster => `<svg viewBox="0 0 40 40" width="100%" height="100%" fill="currentColor">` +
      `<path d="${star(cluster ? 24 : 20, cluster ? 23 : 20, cluster ? 32 : 38)}"/>` +
      (cluster ? `<path d="${star(9, 9, 15)}"/><path d="${star(8, 32, 9)}"/>` : '') + `</svg>`;
    // scatter twinkling sparkles, denser near the screen edge
    [eL, eR].forEach(e => {
      const side = e === eL ? 'left' : 'right';
      e.innerHTML = Array.from({ length: 30 }, () => {
        const x = Math.pow(Math.random(), 1.8) * 100, size = 12 + Math.random() * 20, cluster = Math.random() < .35;
        return `<span class="spk" style="${side}:${x}px;top:${4 + Math.random() * 88}%;width:${size}px;height:${size}px;` +
               `--d:${(0.9 + Math.random() * 1.2).toFixed(2)}s;--dl:-${(Math.random() * 2).toFixed(2)}s">${sparkle(cluster)}</span>`;
      }).join('');
    });
    const rail = $('.rail'), size = $('.size'), cnt = $('.cnt');
    rail.innerHTML = SEEDS.map((s, k) => `<div class="t" style="--r:${R[k]};background-image:url(${url(s, Math.round(90 * R[k]), 90)})"></div>`).join('');
    function setPhoto(el, k) {
      const img = `url(${url(SEEDS[k], Math.round(900 * R[k]), 900)})`, fill = R[k] < 0.7;
      const p = el.querySelector('.pic'); p.style.backgroundImage = img; p.style.backgroundSize = fill ? 'cover' : 'contain';
      const b = el.querySelector('.blur'); b.style.backgroundImage = img; b.style.display = fill ? 'none' : '';
    }
    const thumbs = [...rail.children];
    const state = SEEDS.map(() => null); // null | 'del' | 'keep'
    const history = [];
    let i = 0, busy = false;

    function paint() {
      setPhoto(cur, i % SEEDS.length);
      setPhoto(next, (i + 1) % SEEDS.length);
      size.textContent = SIZES[i % SIZES.length];
      const n = state.filter(x => x === 'del').length;
      cnt.textContent = `👹 ${n}`;
      thumbs.forEach((t, k) => {
        t.classList.toggle('cur', k === i);
        t.classList.toggle('gone', state[k] === 'del');
        t.classList.toggle('kept', state[k] === 'keep');
      });
      const offs = R.slice(0, i).reduce((a, r) => a + 36 * r + 4, 0);
      rail.style.transform = `translateX(${ph.clientWidth / 2 - 21 * R[i] - offs}px)`;
      reset();
    }
    function reset() {
      cur.style.transform = ''; cur.style.opacity = ''; cur.style.filter = ''; cur.style.transformOrigin = '';
      next.style.transform = ''; next.style.filter = '';
      tint.style.opacity = 0;
      [eL, eR].forEach(e => e.style.opacity = 0);
    }

    // live drag look, per style
    function drag(dx) {
      const p = Math.min(Math.abs(dx) / 110, 1), left = dx < 0;
      (left ? eL : eR).style.opacity = p; (left ? eR : eL).style.opacity = 0;
            next.style.filter = `brightness(${.6 + .4 * p})`;
      if (style === 'tinder') {
        cur.style.transformOrigin = '50% 130%';
        cur.style.transform = `translateX(${dx}px) rotate(${dx / 14}deg)`;
        next.style.transform = `scale(${.94 + .06 * p})`;
      } else if (style === 'slide') {
        cur.style.transform = `translateX(${dx}px)`;
        next.style.transform = `translateX(${(left ? 1 : -1) * (1 - p) * 40}%) scale(1)`;
      } else if (style === 'strip') {
        cur.style.transform = `translateX(${dx}px) scale(${1 - .08 * p})`;
        next.style.transform = `scale(${.94 + .06 * p})`;
        cur.style.borderRadius = `${p * 24}px`;
      } else {
        cur.style.transform = `translateX(${dx * .6}px)`;
        tint.style.background = left ? '#ff453a' : '#30d158';
        tint.style.opacity = p * .35;
        next.style.transform = `scale(${.94 + .06 * p})`;
      }
    }

    function anim(el, frames, ms, easing = EASE) {
      return el.animate(frames, { duration: ms, easing, fill: 'forwards' }).finished;
    }

    async function commit(dir, fromDx = 0) {
      if (busy) return; busy = true;
      const W = ph.clientWidth, from = getComputedStyle(cur).transform;
      const nextIn = anim(next, [{ transform: getComputedStyle(next).transform, filter: getComputedStyle(next).filter },
                                 { transform: 'none', filter: 'brightness(1)' }], 320);
      let out;
      if (style === 'tinder') {
        const x = dir === 'del' ? -W * 1.6 : W * 1.6;
        out = anim(cur, [{ transform: from }, { transform: `translateX(${x}px) rotate(${x / 14}deg)` }], 380, 'cubic-bezier(.4,.1,.8,.6)');
      } else if (style === 'slide') {
        const x = dir === 'del' ? -W * 1.05 : W * 1.05;
        out = anim(cur, [{ transform: from }, { transform: `translateX(${x}px)` }], 300);
      } else if (style === 'strip' && dir === 'del') {
        const t = thumbs[i].getBoundingClientRect(), p = ph.getBoundingClientRect();
        const s = t.width / p.width, tx = t.left + t.width / 2 - (p.left + p.width / 2), ty = t.top + t.height / 2 - (p.top + p.height / 2);
        cur.style.transformOrigin = '50% 50%';
        out = anim(cur, [{ transform: from, filter: 'grayscale(0)', borderRadius: cur.style.borderRadius || '0px' },
                         { transform: `translate(${tx}px,${ty}px) scale(${s})`, filter: 'grayscale(1)', borderRadius: '40px', opacity: .5 }], 480,
                   'cubic-bezier(.5,0,.2,1)');
      } else if (style === 'strip') {
        out = anim(cur, [{ transform: from }, { transform: `translateX(${W * 1.1}px) scale(.92)` }], 320);
      } else if (dir === 'del') {
        tint.style.background = '#ff453a';
        anim(tint, [{ opacity: tint.style.opacity || 0 }, { opacity: .6 }], 200);
        out = anim(cur, [{ transform: from, filter: 'blur(0px)', opacity: 1 },
                         { transform: 'translateY(160px) scale(.7) rotate(-6deg)', filter: 'blur(10px)', opacity: 0 }], 520, 'cubic-bezier(.5,0,.9,.5)');
      } else {
        tint.style.background = '#30d158';
        await anim(tint, [{ opacity: tint.style.opacity || 0 }, { opacity: .55 }, { opacity: 0 }], 260);
        out = anim(cur, [{ transform: from }, { transform: `translateX(${W * 1.1}px)` }], 280);
      }
      await Promise.all([out, nextIn]);
      cur.getAnimations().concat(next.getAnimations(), tint.getAnimations()).forEach(a => a.cancel());
      cur.style.borderRadius = '';
      state[i] = dir; history.push(i);
      const done = thumbs[i];
      i = Math.min(i + 1, SEEDS.length - 1);
      paint();
      const cls = dir === 'del' ? 'just' : 'pop';
      done.classList.remove('pop', 'just'); void done.offsetWidth; done.classList.add(cls);
      busy = false;
    }

    async function undo() {
      if (busy || !history.length) return; busy = true;
      const k = history.pop(), dir = state[k];
      state[k] = null; i = k; paint();
      const W = ph.clientWidth;
      const start = dir === 'del' ? `translateX(${-W}px)` : `translateX(${W}px)`;
      await anim(cur, [{ transform: start + (style === 'tinder' ? ` rotate(${dir === 'del' ? -20 : 20}deg)` : '') }, { transform: 'none' }], 360);
      cur.getAnimations().forEach(a => a.cancel());
      busy = false;
    }

    let x0 = null, dx = 0;
    cur.addEventListener('pointerdown', e => { if (busy) return; x0 = e.clientX; dx = 0; cur.setPointerCapture(e.pointerId); });
    cur.addEventListener('pointermove', e => { if (x0 === null) return; dx = e.clientX - x0; drag(dx); });
    const up = () => {
      if (x0 === null) return; x0 = null;
      if (Math.abs(dx) > 90) return commit(dx < 0 ? 'del' : 'keep', dx);
      cur.style.transition = 'transform .35s cubic-bezier(.3,1.6,.5,1)'; next.style.transition = 'transform .3s, filter .3s';
      reset();
      setTimeout(() => { cur.style.transition = ''; next.style.transition = ''; }, 360);
    };
    cur.addEventListener('pointerup', up); cur.addEventListener('pointercancel', up);
    $('.undo').addEventListener('click', undo);
    opt.querySelector('[data-act=del]').onclick = () => commit('del');
    opt.querySelector('[data-act=keep]').onclick = () => commit('keep');
    if (opt.querySelector('.pick')) opt.querySelector('.pick').onclick = () => {
      document.querySelectorAll('.opt').forEach(o => o.classList.toggle('picked', o === opt));
      window.brainstorm && window.brainstorm.choice(style);
    };
    requestAnimationFrame(paint);
  }
  document.querySelectorAll('.opt').forEach(phone);
})();
</script>
